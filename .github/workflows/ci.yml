name: CI

on:
  push:
    branches: [develop]
  pull_request:
  # Deploys call this workflow so they ship exactly the build that passed these checks.
  workflow_call:

concurrency:
  # github.workflow is the caller's name when called, so a deploy never cancels a plain CI run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Public, non-secret build settings live in repo Variables (Settings → Secrets and variables → Actions).
env:
  PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
  PUBLIC_ANALYTICS: ${{ vars.PUBLIC_ANALYTICS }}
  PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build (lists remaining [TODO] markers as warnings)
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test
        run: pnpm test:e2e
      - name: Lighthouse CI
        run: pnpm lhci
      - name: Link check
        run: pnpm linkcheck

      - name: Upload the tested build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 3

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
