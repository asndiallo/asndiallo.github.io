name: Deploy

# Every push to develop deploys (after all checks pass); can also be run by hand.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Lint, typecheck, build, Playwright, Lighthouse, link check. Uploads the tested dist/.
  checks:
    uses: ./.github/workflows/ci.yml

  # The site: Cloudflare Workers static assets (wrangler.jsonc).
  site:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.SITE_LIVE == 'true' && 'https://assane-diallo.com' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist/
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy --message "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

  # Checks the live domain (HTTPS, redirects, headers, canonical URLs). Informational only:
  # a failure never blocks or rolls back the deploy.
  verify-domain:
    needs: site
    if: vars.SITE_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The script only needs Node and curl, so no dependency install.
      - run: node scripts/verify-domain.ts
