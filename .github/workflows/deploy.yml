name: Deploy to GitHub Pages

# Manual until the site is ready to go live (no visible [TODO] placeholders).
# To deploy on every push afterwards, add:
#   push:
#     branches: [develop]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
  PUBLIC_ANALYTICS: ${{ vars.PUBLIC_ANALYTICS }}
  PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
  PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/configure-pages@v6
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Checks the live domain after each deploy (HTTPS, www and github.io redirects, canonical URLs,
  # sitemap, robots.txt). Informational: a failure here never blocks or rolls back the deploy.
  verify-domain:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The script only needs Node and curl, so no dependency install.
      - run: node scripts/verify-domain.ts
