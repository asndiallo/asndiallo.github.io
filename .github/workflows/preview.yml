name: Preview

# Every pull request from this repository gets its own preview URL on workers.dev, posted as a
# PR comment. Production is untouched: `wrangler versions upload` doesn't deploy the version.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Fork and Dependabot PRs don't get Actions secrets, so they get CI only.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
      PUBLIC_ANALYTICS: ${{ vars.PUBLIC_ANALYTICS }}
      PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
      # Previews also show draft case studies; production never does.
      SHOW_DRAFTS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Upload preview version
        id: upload
        run: |
          # Print wrangler's output even when it fails (the shell runs with -e).
          if ! out=$(pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" --message "PR #${{ github.event.pull_request.number }} ${{ github.sha }}" 2>&1); then
            echo "$out"
            exit 1
          fi
          echo "$out"
          url=$(echo "$out" | grep -Eo 'https://pr-${{ github.event.pull_request.number }}-[^ ]+\.workers\.dev' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
      - name: Comment the preview URL
        if: steps.upload.outputs.url != ''
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none \
            --body "Preview for ${{ github.sha }}: ${{ steps.upload.outputs.url }}"
        env:
          GH_TOKEN: ${{ github.token }}
